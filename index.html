<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Poly Glance — Polymarket odds on Even G2</title>
    <style>
      html, body { margin: 0; background: #000; color: #39ff6a;
        font-family: ui-monospace, Menlo, Consolas, monospace; }
      #app { max-width: 640px; margin: 0 auto; padding: 16px; }
      h1 { font-size: 14px; letter-spacing: 1px; margin: 0 0 12px; }
      #mirror {
        width: 576px; max-width: 100%; height: 288px;
        background: #021002; color: #39ff6a;
        border: 1px solid #1d5c2e; border-radius: 6px;
        padding: 10px; box-sizing: border-box;
        white-space: pre-wrap; overflow: hidden;
        font-size: 15px; line-height: 1.35; cursor: pointer;
      }
      #devlist { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; }
      #devlist button {
        text-align: left; background: #03170a; color: #39ff6a;
        border: 1px solid #1d5c2e; border-radius: 4px;
        padding: 8px 10px; font: inherit; font-size: 13px; cursor: pointer;
      }
      #devlist button:hover { background: #0a2f16; }
      #voicetalk {
        margin-top: 12px; background: #0a2f16; color: #39ff6a;
        border: 1px solid #39ff6a; border-radius: 4px;
        padding: 10px 16px; font: inherit; cursor: pointer;
      }
      #devhint { margin-top: 12px; font-size: 12px; color: #2f9e4f; line-height: 1.5; }
    </style>
  </head>
  <body>
    <div id="app">
      <h1>POLY GLANCE — browser preview (576x288 glance mirror)</h1>
      <pre id="mirror">Starting…</pre>
      <div id="devlist"></div>
      <button id="voicetalk" type="button">Hold to talk (voice)</button>
      <div id="devhint"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
